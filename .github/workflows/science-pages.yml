name: Build science catalog and deploy Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: science-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Reject unprotected lesson content
        run: python3 tools/check_public_content.py --root .
      - name: Prepare existing static website
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude='_site/' --exclude='.git/' --exclude='.github/' \
            --exclude='.env*' --exclude='.codex/' --exclude='node_modules/' \
            --exclude='tools/' --exclude='tests/' --exclude='docs/' \
            --exclude='examples/' --exclude='backend_source/' --exclude='supabase/' \
            --exclude='backup/' --exclude='backups/' --exclude='__pycache__/' \
            --exclude='curriculum-settings.json' --exclude='README_SETUP.md'
      - name: Generate Unit and lesson banners
        run: python3 tools/build_catalog.py --root . --output _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
