  <script>
    const PRINT_CONFIG = Object.freeze({UNIT_KEY:"unit3_eval", LESSON_ID:"u3e_l2", FALLBACK_SCHOOL_YEAR:2026});
    (function lockGuard(){
      const cfg=window.PLATFORM_CONFIG||{}, api=cfg.LOCK_API||cfg.PLATFORM_API||"";
      if(location.protocol==="file:"||!api) return;
      let inFlight=null;
      async function check(){
        if(inFlight)return inFlight;
        inFlight=(async()=>{
          let lastError=null;
          for(let attempt=1;attempt<=3;attempt++){
            const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),4500);
            try{
              const r=await fetch(api,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"get_locks"}),cache:"no-store",signal:controller.signal});clearTimeout(timer);
              if(!r.ok)throw new Error(`HTTP ${r.status}`);
              const d=await r.json(),u=d?.[PRINT_CONFIG.UNIT_KEY];
              if(u&&(u.isLocked===true||u.lessons?.[PRINT_CONFIG.LESSON_ID]===true)){
                document.documentElement.innerHTML=`<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>접근 제한</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1120;color:#e2e8f0;font-family:'Malgun Gothic';text-align:center}.b{padding:28px;border:1px solid #334155;border-radius:14px;background:#111827}h2{color:#f87171}</style></head><body><div class="b"><h2>🔒 활동지 인쇄센터 접근 제한</h2><p>선생님의 안내를 기다려 주세요.</p></div></body>`;
              }
              if(typeof window.onPrintRealtimeResync==="function"){
                Promise.resolve(window.onPrintRealtimeResync("lock_changed")).catch(error=>console.warn("인쇄센터 실시간 상태 동기화 실패",error));
              }
              lastError=null;break;
            }catch(e){clearTimeout(timer);lastError=e;if(attempt<3)await new Promise(r=>setTimeout(r,450*attempt));}
          }
          if(lastError)console.warn("잠금 확인 실패",lastError);
        })().finally(()=>{inFlight=null;});
        return inFlight;
      }
      check();
      if(typeof window.createLockRealtimeClient==="function"){
        const rtc=window.createLockRealtimeClient(check);
        document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){rtc.reconnect();check();}});
        window.addEventListener("focus",()=>{rtc.reconnect();check();});
      }
    })();
  </script>

    @page{size:A4 portrait;margin:10mm}
    @media print{html,body{background:#fff}.screen,.modal{display:none!important}#printArea{display:block}.print-page{width:auto;height:277mm;margin:0;box-shadow:none}.page-inner{height:277mm}}

<body>
  <section class="screen">
    <div class="topline"><div><h1>🧑‍🏫 Unit 3 개인별 활동지 인쇄센터</h1><p>학생의 모든 제출 이력을 보존한 상태에서 원하는 회차를 선택하여 A4 2쪽으로 인쇄하고, 특정 학생에게만 재제출을 허용할 수 있습니다.</p></div><span id="adminState">관리자 인증 필요</span></div>
    <div id="authPanel" class="auth-panel"><b>교사 인증</b><br><input id="adminPw" type="password" placeholder="관리자 비밀번호"><button id="authBtn" onclick="authenticateTeacher()">인증</button><span id="authMsg" style="font-size:.78rem;margin-left:8px;color:#b91c1c"></span></div>
    <div id="controlPanel" style="display:none">
      <div class="sound-control"><div><b>🔊 수행평가 전체 소리</b><div style="font-size:.72rem;color:#64748b;margin-top:2px">실제 수행평가에서는 전체 음소거를 권장합니다. 변경 내용은 열린 학생 화면에 Realtime으로 전달됩니다.</div></div><div style="display:flex;align-items:center;gap:7px"><span id="globalSoundStatus" class="sound-state muted">전체 음소거 확인 중</span><button id="globalSoundBtn" class="unmute" onclick="toggleGlobalSoundMute()">음소거 해제</button></div></div>
      <label style="font-weight:900;font-size:.86rem">불러올 학번</label><textarea id="studentIds" class="ids" placeholder="학번을 줄바꿈, 쉼표 또는 공백으로 구분해 입력하세요.&#10;예: 20101 20102 20103"></textarea>
      <div class="toolbar"><button onclick="fetchAllStudents()">제출 이력 불러오기</button><button class="secondary" onclick="loadSampleStudents()">샘플 2명 보기</button><button class="success" id="printBtn" onclick="prepareAndPrint()" disabled>선택 학생 전체 인쇄</button><button class="secondary" id="csvBtn" onclick="downloadCSV()" disabled>선택 제출본 CSV</button><button class="danger" onclick="clearLoaded()">목록 초기화</button></div>
      <div id="status" class="status">학번을 입력하고 제출 이력을 불러오세요. 한 학생에게 제출본이 여러 개 있으면 최신 회차가 기본 선택됩니다.</div><div id="studentList" class="student-list"></div>
    </div>
  </section>
  <div id="printArea"></div>

  <div id="versionModal" class="modal"><div class="modal-box"><div class="modal-head"><h2 id="versionModalTitle">제출본 선택</h2><button class="modal-close" onclick="closeModal('versionModal')">닫기</button></div><div id="versionModalBody" class="version-list"></div><div class="modal-actions"><button onclick="closeModal('versionModal')">취소</button><button class="primary" onclick="confirmVersionChoice()">이 제출본 사용</button></div></div></div>

  <script>
"use strict";
const cfg=window.PLATFORM_CONFIG||{};
const PLATFORM_API_URL=cfg.PLATFORM_API||"";
const ACADEMIC_YEAR_API_URL=cfg.ACADEMIC_YEAR_API||PLATFORM_API_URL;
const API_BASE_URL=cfg.baseUrl||(()=>{try{return PLATFORM_API_URL?new URL(PLATFORM_API_URL).origin:"";}catch{return "";}})();
const ASSESSMENT_API_URL=cfg.ASSESSMENT_API||(API_BASE_URL?`${API_BASE_URL}/functions/v1/assessment-api`:"");
const DATA_LESSON_ID="u3e_l3";
const VARIABLE_OPTIONS={
  voltage:{label:"입력 신호의 전압 크기",short:"전압",unit:"V"},
  resistance:{label:"회로의 설정 저항",short:"저항",unit:"Ω"},
  frequency:{label:"입력 신호의 진동수",short:"진동수",unit:"Hz"},
  current:{label:"회로 전류",short:"전류",unit:"A"},
  amplitude:{label:"소리 파동의 상대 진폭",short:"상대 진폭",unit:"상대값"},
  wavelength:{label:"소리의 파장",short:"파장",unit:"m"},
  speaker:{label:"같은 스피커 사용",short:"같은 스피커",unit:""},
  measurement:{label:"같은 측정 방법 사용",short:"같은 측정 방법",unit:""}
};
let CURRENT_SCHOOL_YEAR=PRINT_CONFIG.FALLBACK_SCHOOL_YEAR;
let currentYearPromise=null;
let teacherAuthed=false,adminKey="",loaded=[],versionModalStudentIndex=-1;
let teacherSoundMuted=true,runtimeStateLoaded=false;
const $=id=>document.getElementById(id);

async function sha256(text){const bytes=new TextEncoder().encode(text);const hash=await crypto.subtle.digest("SHA-256",bytes);return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,"0")).join("");}
async function ensureCurrentSchoolYear(){
  if(currentYearPromise)return currentYearPromise;
  currentYearPromise=(async()=>{if(!ACADEMIC_YEAR_API_URL)return CURRENT_SCHOOL_YEAR;try{const r=await fetch(ACADEMIC_YEAR_API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"get_public_config"}),cache:"no-store"});const d=await r.json();const y=Number(d?.currentSchoolYear);if(r.ok&&d?.success===true&&Number.isInteger(y)&&y>=2000&&y<=2100)CURRENT_SCHOOL_YEAR=y;}catch(e){console.warn("학년도 확인 실패",e);}return CURRENT_SCHOOL_YEAR;})();
  return currentYearPromise;
}
function currentAdminToken(){return String(sessionStorage.getItem("current_admin_key")||"");}
function currentAdminReady(){try{const u=JSON.parse(sessionStorage.getItem("current_student")||"null"),token=currentAdminToken();return u?.isAdmin===true&&token.startsWith("adm_");}catch{return false;}}
function unlockControls(token){
  teacherAuthed=true;adminKey=String(token||currentAdminToken());$("authPanel").style.display="none";$("controlPanel").style.display="block";$("adminState").textContent="✅ 관리자 인증됨";
  loadRuntimeState(true);
}
function lockControls(message="관리자 인증이 필요합니다."){
  teacherAuthed=false;adminKey="";$("authPanel").style.display="block";$("controlPanel").style.display="none";$("authMsg").textContent=message;
}
async function authenticateTeacher(){
  if(location.protocol==="file:"){unlockControls("LOCAL_PREVIEW");return;}
  const pw=$("adminPw").value.trim(),msg=$("authMsg"),btn=$("authBtn");if(!pw){msg.textContent="비밀번호를 입력하세요.";return;}if(!PLATFORM_API_URL){msg.textContent="플랫폼 API 설정을 찾을 수 없습니다.";return;}
  btn.disabled=true;btn.textContent="인증 중...";msg.textContent="";
  try{
    const r=await fetch(PLATFORM_API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"verifyAuth",passwordHash:await sha256(pw)})});
    const d=await r.json();if(!r.ok||!(d?.success===true||d?.ok===true))throw new Error(d?.message||"관리자 비밀번호가 일치하지 않습니다.");
    const token=String(d.adminSessionToken||"");if(!token.startsWith("adm_"))throw new Error("관리자 세션을 발급받지 못했습니다.");
    sessionStorage.setItem("current_admin_key",token);unlockControls(token);await ensureCurrentSchoolYear();
  }catch(e){console.error(e);msg.textContent=e.message||"인증 통신 오류가 발생했습니다.";}
  finally{btn.disabled=false;btn.textContent="인증";}
}
if(currentAdminReady()||location.protocol==="file:")unlockControls(location.protocol==="file:"?"LOCAL_PREVIEW":currentAdminToken());
ensureCurrentSchoolYear();

async function apiPost(payload,timeoutMs=20000){
  if(!ASSESSMENT_API_URL)throw new Error("수행평가 서버 주소를 찾을 수 없습니다.");
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeoutMs);
  try{const r=await fetch(ASSESSMENT_API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload),cache:"no-store",signal:controller.signal});const d=await r.json().catch(()=>({success:false,message:`서버 응답을 읽지 못했습니다. (HTTP ${r.status})`}));return{response:r,data:d};}finally{clearTimeout(timer);}
}

function renderGlobalSoundState(){
  const status=$("globalSoundStatus"),btn=$("globalSoundBtn");if(!status||!btn)return;
  status.className=`sound-state ${teacherSoundMuted?"muted":"open"}`;
  status.textContent=teacherSoundMuted?"🔇 전체 음소거 중":"🔊 소리 사용 가능";
  btn.className=teacherSoundMuted?"unmute":"mute";
  btn.textContent=teacherSoundMuted?"음소거 해제":"전체 음소거";
}
async function loadRuntimeState(silent=false){
  if(location.protocol==="file:"){teacherSoundMuted=true;runtimeStateLoaded=true;renderGlobalSoundState();return;}
  if(!ASSESSMENT_API_URL){teacherSoundMuted=true;runtimeStateLoaded=false;renderGlobalSoundState();return;}
  try{
    const {response,data}=await apiPost({action:"get_runtime_state",lessonId:DATA_LESSON_ID},8000);
    if(!response.ok||data?.success!==true)throw new Error(data?.message||"소리 상태 확인 실패");
    teacherSoundMuted=data.soundMuted!==false;runtimeStateLoaded=true;renderGlobalSoundState();

  if(dep==="amplitude"){extraHead="<th>보조 전류(A)</th>";extraCell=m=>`<td>${formatValue(m.current,"current")}</td>`;}else if(dep==="wavelength"){extraHead="<th>소리 관찰</th>";extraCell=m=>`<td>${esc(m.pitch||"")}</td>`;}
  const head=`<tr><th>조건</th><th>반복</th><th>${esc(ind?shortOf(ind):"조작 변인")}<br>${ind&&unitOf(ind)?`(${esc(unitOf(ind))})`:""}</th><th>${esc(dep?shortOf(dep):"종속 변인")}<br>${dep&&unitOf(dep)?`(${esc(unitOf(dep))})`:""}</th>${extraHead}<th>고정 조건</th></tr>`;
  const groups=groupMeasurementsVersion(v),body=groups.length?groups.flatMap(g=>g.rows.map(m=>`<tr><td>${g.conditionNo}</td><td>${m.repeat}</td><td>${formatValue(m.independentValue,ind)}</td><td>${formatValue(m.dependentValue,dep)}</td>${extraCell(m)}<td>${esc(fixedControlsText(p,m))}</td></tr>`)).join(""):`<tr><td class="empty-row" colspan="${5+(extraHead?1:0)}">원자료가 제출되지 않았습니다.</td></tr>`;return{head,body};
}
function transformedRowsHtml(s){const v=selectedVersion(s),p=v.plan,ind=String(p.variables.independent||""),dep=String(p.variables.dependent||""),groups=groupMeasurementsVersion(v);return groups.length?groups.map(g=>`<tr><td>${g.conditionNo}</td><td>${formatValue(g.rows[0].independentValue,ind)}</td><td>${g.rows.map(row=>formatValue(row.dependentValue,dep)).join(", ")}</td><td></td></tr>`).join(""):`<tr><td class="empty-row" colspan="4">원자료가 없어 평균과 그래프를 작성할 수 없습니다.</td></tr>`;}
function pageHeader(s,title){const v=selectedVersion(s);return`<div class="doc-head"><h1 class="doc-title">${title}</h1><table class="info"><tr><th style="width:8%">학번</th><td style="width:15%">${esc(s.studentId)}</td><th style="width:8%">이름</th><td style="width:14%">${esc(s.studentName)}</td><th style="width:10%">제출본</th><td style="width:18%">제${v.attemptNo}차 · ${esc(fmtDate(v.submittedAt))}</td><th style="width:11%">교사 확인</th><td></td></tr></table></div>`;}
function variablePills(keys){return(keys||[]).map(k=>`<span class="variable-pill">${esc(labelOf(k))}</span>`).join("")||"-";}
function controlValuesHtml(p){const ind=String(p?.variables?.independent||""),controlled=Array.isArray(p?.variables?.controlled)?p.variables.controlled:[],keys=["voltage","resistance","frequency"].filter(k=>k!==ind&&controlled.includes(k));return keys.length?keys.map(k=>`${esc(shortOf(k))} ${esc(formatValue(p.controlValues?.[k],k))}${esc(unitOf(k))}`).join(" · "):"-";}
function procedureHtml(p){const steps=Array.isArray(p.procedureSteps)?p.procedureSteps:[];return steps.length?`<div class="procedure-print-grid">${steps.map((x,i)=>`<div class="procedure-print-item"><b>${i+1}.</b>${nl(x)}</div>`).join("")}</div>`:`<div class="auto-text">-</div>`;}
function conclusionHint(p){const dep=String(p?.variables?.dependent||"");if(dep==="amplitude")return"구체적인 평균값과 그래프 경향을 이용하고, 전기 조건·전류·코일과 자석·진동판·진폭을 연결하여 설명하세요.";if(dep==="current")return"구체적인 평균값과 그래프 경향을 이용하여 전기 조건과 전류 사이의 관계를 설명하세요.";if(dep==="wavelength")return"구체적인 평균값과 그래프 경향을 이용하여 진동수, 소리의 높낮이, 파장 사이의 관계를 설명하세요.";return"제출된 자료의 범위에서 확인할 수 있는 내용을 수치와 함께 서술하세요.";}
function validityHint(p){const dep=String(p?.variables?.dependent||"");if(dep==="current")return"통제한 입력 조건, 조작 범위와 간격, 반복 횟수, 전류 측정값의 작은 차이, 회로를 이상적인 저항 회로로 단순화한 한계를 검토하세요.";if(dep==="amplitude")return"통제한 입력 조건, 조작 범위와 간격, 반복 횟수, 상대 진폭 측정값의 작은 차이, 실제 스피커의 주파수 응답과 효율을 단순화한 한계를 검토하세요.";if(dep==="wavelength")return"통제한 전압·저항, 진동수 범위와 간격, 반복 횟수, 파장 측정값의 작은 차이, 공기 중 소리 속력을 340 m/s로 고정한 한계를 검토하세요.";return"변인 설정, 통제 조건, 자료 수, 반복 측정 여부와 원자료의 한계를 검토하세요.";}
function roundingNote(dep){if(dep==="current")return"평균 전류는 소수 둘째 자리까지 반올림하세요.";if(dep==="amplitude")return"평균 상대 진폭은 소수 첫째 자리까지 반올림하세요.";if(dep==="wavelength")return"평균 파장은 소수 셋째 자리까지 반올림하세요.";return"원자료가 있다면 같은 소수 자리 기준으로 평균을 나타내세요.";}
function plannedValuesText(p){const ind=String(p?.variables?.independent||""),vals=Array.isArray(p.plannedValues)?p.plannedValues:[];return vals.length&&ind?vals.map(v=>`${formatValue(v,ind)} ${unitOf(ind)}`).join(" · "):"-";}
function makePages(s){
  const v=selectedVersion(s),p=v.plan,ind=String(p.variables.independent||""),dep=String(p.variables.dependent||""),controls=p.variables.controlled||[],raw=rawTableParts(s),warnings=Array.isArray(v.validationWarnings)?v.validationWarnings:[];
  const relationText=ind||dep?`${ind?labelOf(ind):"미선택"} → ${dep?labelOf(dep):"미선택"}`:"변인 미선택";
  const incompleteNote=warnings.length?`<div class="scenario incomplete-print"><b>미완성 제출 안내</b> 이 제출본에는 다음 미완성 항목이 기록되어 있습니다: ${esc(warnings.join(" · "))}</div>`:"";
  const p1=`<section class="print-page"><div class="page-inner">${pageHeader(s,"소리 신호 탐구 설계실 · 개인별 평가 자료")}
    <div class="scenario"><b>탐구 상황</b> 학생은 직접 조절할 입력 조건 하나를 조작 변인으로 선택하고, 측정되는 결과 하나를 종속 변인으로 선택하였다. 나머지 입력 조건을 고정하고, 계획한 서로 다른 값에서 반복 측정하였다. <span class="submission-note">접수번호 ${esc(shortId(v.submissionId))}</span></div>
    ${incompleteNote}
    <div><span class="criterion-label">Criterion B. 탐구 및 설계하기</span></div>
    <div class="two"><div class="section"><div class="section-title">B.i 과학적 연구로 검증할 문제 또는 관계</div><div class="auto-text">${nl(p.researchQuestion||"-")}</div></div><div class="section"><div class="section-title">B.ii 가설</div><div class="auto-text">${nl(p.hypothesis||"-")}</div></div></div>
    <div class="section"><div class="section-title">B.ii 과학적 추론</div><div class="auto-text">${nl(p.reasoning||"-")}</div></div>
    <div class="section"><div class="section-title">전자석 스피커가 소리를 만드는 과정</div><div class="auto-text compact-answer">${nl(p.speakerEnergyExplanation||"-")}</div></div>
    <div class="section"><div class="section-title">B.iii 학생이 설정한 변인과 수집 계획</div><table class="compact-table variable-table"><tr><th>조작 변인</th><th>종속 변인</th><th>통제 변인</th><th>반복</th></tr><tr><td>${variablePills(ind?[ind]:[])}</td><td>${variablePills(dep?[dep]:[])}</td><td>${variablePills(controls)}<div class="fixed-value">고정값: ${esc(controlValuesHtml(p))}</div></td><td style="text-align:center">각 조건 ${p.repeatCount||"-"}회</td></tr></table><div class="fixed-value"><b>계획한 조작값:</b> ${esc(plannedValuesText(p))}</div><div class="two" style="margin-top:.8mm"><div class="mini-box"><div class="mini-title">통제 방법</div><div class="mini-text">${nl(p.controlMethod||"-")}</div></div><div class="mini-box"><div class="mini-title">데이터 수집 방법</div><div class="mini-text">${nl(p.collectionMethod||"-")}</div></div></div></div>
    <div class="section"><div class="section-title">B.iv 학생이 설계한 연구 방법</div>${procedureHtml(p)}</div>
    <div class="section raw-section" style="margin-bottom:0"><div class="section-title">C.i 1차시에서 수집한 원자료</div><table class="compact-table raw-table"><thead>${raw.head}</thead><tbody>${raw.body}</tbody></table></div>
    <div class="page-footer"><span>학생이 제출한 Criterion B 답안과 원자료 · 제${v.attemptNo}차 제출본</span><span>1 / 2</span></div></div></section>`;
  const p2=`<section class="print-page"><div class="page-inner">${pageHeader(s,"소리 신호 탐구 설계실 · Criterion C 서면 평가")}
    <div><span class="criterion-label">Criterion C. 처리 및 평가하기</span></div>
    ${warnings.length?`<div class="scenario incomplete-print"><b>미완성 제출본</b> 원자료나 변인 설정이 부족하면 평균·그래프·결론 작성이 제한될 수 있습니다.</div>`:""}
    <div class="section"><div class="section-title">C.i 수집하고 변형한 데이터 제시</div><table class="compact-table"><thead><tr><th>조건</th><th>${esc(ind?labelOf(ind):"조작 변인")}<br>${ind&&unitOf(ind)?`(${esc(unitOf(ind))})`:""}</th><th>${esc(dep?labelOf(dep):"종속 변인")} 반복 측정값<br>${dep&&unitOf(dep)?`(${esc(unitOf(dep))})`:""}</th><th>평균 ${esc(dep?shortOf(dep):"종속 변인")}</th></tr></thead><tbody>${transformedRowsHtml(s)}</tbody></table><div class="print-only-note">반복 측정값의 평균을 계산하여 마지막 칸을 완성하세요. ${esc(roundingNote(dep))} 평균값은 아래 그래프에 사용합니다.</div></div>
    <div class="graph-title">[그래프] ${esc(relationText)} <span class="hint">두 축의 눈금을 알맞은 간격으로 표시하고, 평균값 데이터 점과 전체 경향을 나타내는 선 또는 곡선을 그리세요.</span></div><div class="graph"><span class="axis-y">${esc(dep?labelOf(dep):"종속 변인")} ${dep&&unitOf(dep)?`(${esc(unitOf(dep))})`:""}</span><span class="axis-x">${esc(ind?labelOf(ind):"조작 변인")} ${ind&&unitOf(ind)?`(${esc(unitOf(ind))})`:""}</span></div>
    <div class="section"><div class="question">C.ii 데이터를 해석하고 과학적 추론을 사용해 결론을 서술한다.</div><div class="hint">${esc(conclusionHint(p))}</div><div class="write-area cii"></div></div>
    <div class="section"><div class="question">C.iii 연구 결과를 토대로 가설의 타당성에 관해 논한다.</div><div class="hint">가설에서 예상한 변화와 실제 평균값·그래프를 비교하여 지지 여부를 판단하고 수치로 근거를 제시하세요.</div><div class="write-area ciii"></div></div>
    <div class="section"><div class="question">C.iv 연구 방법의 타당성에 관해 논한다.</div><div class="hint">${esc(validityHint(p))}</div><div class="write-area civ"></div></div>
    <div class="section"><div class="question">C.v 연구 방법의 개선 또는 확장 방안을 서술한다.</div><div class="hint">확인한 한계를 직접 줄이는 구체적 개선안 또는 새로 탐구할 변인을 제안하고, 기대되는 효과를 설명하세요.</div><div class="write-area cv"></div></div>
    <div class="page-footer"><span>2차시 서면 수행평가 · 태블릿 및 인터넷 사용 없음 · 제${v.attemptNo}차 제출본 기준</span><span>2 / 2</span></div></div></section>`;
  return p1+p2;
}
function selectedStudents(){return loaded.filter(x=>x.ok&&x.selected);}
function buildPrintArea(students=selectedStudents()){$("printArea").innerHTML=students.map(makePages).join("");return students.length;}
function prepareAndPrint(){const count=buildPrintArea();if(!count){alert("인쇄할 학생을 선택하세요.");return;}setTimeout(()=>window.print(),160);}
function printOne(index){const s=loaded[index];if(!s?.ok)return;buildPrintArea([s]);setTimeout(()=>window.print(),160);}
function csvCell(v){const s=String(v??"").replace(/"/g,'""');return`"${s}"`;}
function downloadCSV(){
  const rows=[["학번","이름","학년도","선택 제출 회차","최초/재제출","제출 시각","접수번호","과학적 연구로 검증할 문제 또는 관계","가설","과학적 추론","전자석 스피커가 소리를 만드는 과정","조작 변인","종속 변인","통제 변인","통제 고정값","계획한 조작값","통제 방법","데이터 수집 방법","반복 횟수","연구 방법(JSON)","원자료(JSON)","미완성 항목(JSON)","화면 이탈 횟수","화면 이탈 기록(JSON)","저장된 전체 제출본 수","재제출 허용 상태","재제출 허용 정보(JSON)"]];
  selectedStudents().forEach(s=>{const v=selectedVersion(s),p=v.plan;rows.push([s.studentId,s.studentName,s.schoolYear,v.attemptNo,v.attemptNo>1?"재제출":"최초 제출",v.submittedAt,v.submissionId,p.researchQuestion,p.hypothesis,p.reasoning,p.speakerEnergyExplanation||"",labelOf(p.variables.independent),labelOf(p.variables.dependent),(p.variables.controlled||[]).map(labelOf).join("|"),JSON.stringify(p.controlValues||{}),JSON.stringify(p.plannedValues||[]),p.controlMethod,p.collectionMethod,p.repeatCount,JSON.stringify(p.procedureSteps||[]),JSON.stringify(v.measurements),JSON.stringify(v.validationWarnings||[]),Number(v.audit?.awayCount)||0,JSON.stringify(v.audit?.auditEvents||[]),s.versions.length,s.resubmissionAllowed?"허용":"잠김",JSON.stringify(s.resubmission||{})]);});
  const csv="\uFEFF"+rows.map(r=>r.map(csvCell).join(",")).join("\r\n"),blob=new Blob([csv],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`Unit3_소리신호탐구_선택제출본_${new Date().toISOString().slice(0,10)}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function closeModal(id){$(id).style.display="none";}
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.querySelectorAll(".modal").forEach(m=>m.style.display="none");if(e.key==="Enter"&&document.activeElement===$("adminPw"))authenticateTeacher();});
